[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-cartographer"
version = "0.1.0"
description = "Lake-first collection metadata pipeline for the Met and AIC."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "minio==7.2.20",
  "pandera[polars]>=0.23,<1",
  "polars>=1.24,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=24.4,<26",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
orchestration = ["prefect>=3.1,<4"]
transforms = ["dbt-core>=1.9,<2", "dbt-duckdb>=1.9,<2"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pyyaml>=6,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_cartographer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evidence_cartographer"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minio.*", "pandera.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["evidence_cartographer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
